<!doctype html>
<html lang="en">

<head>

    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <title>ACCOUNTING SYSTEM</title>

  <!-- Android / Chrome / Edge theme color (matches the employee manifest) -->
  <meta name="theme-color" content="#1f2640" />
  <!-- Run fullscreen, no browser UI, when installed / added to home screen -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ACCOUNTING SYSTEM" />

  <!-- iOS home screen icon (needs its own tag, ignores manifest icons) -->

  <!-- Standard favicon -->

         ManifestSync (in App.jsx) may swap this to /manifest-admin.json on the /admin route. -->
